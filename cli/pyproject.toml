[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bwiza-tokenizer-cli"
version = "0.0.0"
description = "Command-line interface for bwiza-tokenizer"
requires-python = ">=3.12"
dependencies = ["bwiza-tokenizer-trainer"]

[project.scripts]
bwiza-tokenizer = "bwiza_tokenizer_cli.main:main"

[tool.pytest.ini_options]
pythonpath = ["src", "../trainer/src"]
testpaths = ["tests"]
